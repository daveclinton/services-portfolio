services:
  api:
    build: .
    image: portfolio-api:latest
    container_name: portfolio-api
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the container, listen on all interfaces; the host only
      # publishes the port on loopback, so nginx is the only way in.
      ADDR: 0.0.0.0:8080
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/portfolio-api", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 75s   # let streaming answers and conversation logging finish
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
