# The same file runs locally (`make up`) and on the VPS (deploy/setup.sh).
# Ports are only published on 127.0.0.1; on the VPS nginx is the way in.
name: portfolio-api

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: portfolio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_DB: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the extensions and tables the first time the volume is empty.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      # For psql and the knowledge-backend pipeline (locally, or over an SSH tunnel).
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional self-hosted embeddings: Hugging Face Text Embeddings Inference on
  # CPU. Off by default; see "Semantic search" in .env.example. Without it, search
  # uses full-text only, which is fine because every answer already gets the
  # whole knowledge base. The model downloads into the hf-models volume on
  # first start. On Apple Silicon set EMBEDDINGS_IMAGE=...:cpu-arm64-1.9.
  embeddings:
    profiles: ["embeddings"]
    image: ${EMBEDDINGS_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}
    container_name: portfolio-embeddings
    restart: unless-stopped
    command: ["--model-id", "${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}", "--max-client-batch-size", "32", "--max-batch-tokens", "2048"]
    # Hard cap so a small VPS can't be pushed into swap by this service.
    mem_limit: ${EMBEDDINGS_MEMORY_LIMIT:-512m}
    volumes:
      - hf-models:/data
    ports:
      - "127.0.0.1:${EMBED_PORT:-8090}:80"
    logging: *logging

  api:
    build: .
    image: portfolio-api:latest
    container_name: portfolio-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # Not waiting for healthy: while the model loads, search falls back to
      # full-text and the indexer catches up on its next run.
      embeddings:
        condition: service_started
        required: false
    env_file: .env
    environment:
      # Inside the container, listen on all interfaces and talk to the db
      # service over Docker's private network. These override .env.
      ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://portfolio:${POSTGRES_PASSWORD}@db:5432/portfolio?sslmode=disable
      # Empty unless semantic search is switched on (see .env.example).
      EMBEDDINGS_URL: ${EMBEDDINGS_URL_IN_DOCKER-}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/portfolio-api", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 75s   # let streaming answers and conversation logging finish
    logging: *logging

volumes:
  pgdata:
  hf-models:
