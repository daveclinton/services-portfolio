# fly.toml app configuration file generated for backend-restless-dawn-6537 on 2026-09-20T20:42:10+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'backend-restless-dawn-6537'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'python manage.py migrate --noinput'

[env]
  DB_CONN_MAX_AGE = '60'
  DEBUG = 'False'
  PORT = '8000'
  PYTHONUNBUFFERED = '1'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health/'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
