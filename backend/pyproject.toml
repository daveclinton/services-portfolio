# Offline Django data pipeline. Runtime dependencies mirror requirements.txt;
# test-only packages stay in requirements.txt.
[project]
name = "portfolio-backend"
version = "0.1.0"
description = "Offline knowledge ingestion, embeddings, evaluation, and database migrations"
requires-python = ">=3.12"
dependencies = [
  "Django==6.1.1",
  "pgvector==0.5.0",
  "psycopg[binary]==3.3.6",
  "python-dotenv==1.2.3",
  "python-frontmatter==1.3.0",
  "pydantic==2.13.5",
  "openai==3.16.2",
]
